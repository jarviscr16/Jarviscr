<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Jarvis - Clash Royale Coaching</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              royale: {
                dark: '#1e3a8a', // Deep Blue
                mid: '#2563eb',  // Mid Blue
                light: '#38bdf8', // Light Blue/Cyan
                gold: '#fbbf24', // Gold
                goldHover: '#d97706',
                bg: '#0f172a', // Slate 900
                card: '#1e293b', // Slate 800
              }
            },
            fontFamily: {
              sans: ['Inter', 'sans-serif'],
            }
          }
        }
      }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
      body { 
        font-family: 'Inter', sans-serif; 
        background-color: #0f172a; 
        color: white; 
        /* King Pointer for default */
        cursor: url('https://cdn.custom-cursor.com/db/9762/32/clash-royale-king-pointer.png'), auto !important;
      }
      
      /* Sword cursor for interactive elements */
      a, button, input, select, textarea, [role="button"], .cursor-pointer {
        cursor: url('https://cdn.custom-cursor.com/db/9847/32/clash-royale-sword-cursor.png'), pointer !important;
      }
    </style>
